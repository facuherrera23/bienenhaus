name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bienenhaus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest tests/ -v
        env:
          SECRET_KEY: test-secret-key-not-for-prod
          DATABASE_URL: sqlite:///:memory:
          CSRF_BYPASS: "1"
          ENVIRONMENT: testing

  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Flask for frontend tests
        run: |
          gunicorn -c gunicorn.conf.py app:application &
          sleep 3
          curl -f http://localhost:5000/api/health
        env:
          SECRET_KEY: test-secret-key-not-for-prod
          DATABASE_URL: sqlite:///:memory:
          CSRF_BYPASS: "1"
          ENVIRONMENT: testing
          PORT: "5000"
          SITE_URL: http://localhost:5000

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: pip install playwright && playwright install chromium

      - name: Run frontend E2E tests
        run: python ../frontend/tests/test_pages.py
        env:
          SECRET_KEY: test-secret-key-not-for-prod
          DATABASE_URL: sqlite:///:memory:
          CSRF_BYPASS: "1"
          ENVIRONMENT: testing
          PORT: "5000"
          SITE_URL: http://localhost:5000

      - name: Run frontend admin audit
        run: python ../frontend/tests/test_admin_audit.py
        env:
          SECRET_KEY: test-secret-key-not-for-prod
          DATABASE_URL: sqlite:///:memory:
          CSRF_BYPASS: "1"
          ENVIRONMENT: testing
          PORT: "5000"
          SITE_URL: http://localhost:5000
