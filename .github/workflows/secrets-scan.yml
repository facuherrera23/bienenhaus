name: Secrets Scan (manual)

# ⚠️ REPO PÚBLICO — no se suben artifacts ni se imprimen valores de secretos.
# Este workflow solo imprime INSTRUCCIONES para correr gitleaks localmente
# + un scan opcional REDACTADO (valores censurados con ***).
# Para el reporte completo (con valores reales), corré en tu máquina:
#
#   docker run --rm -v "$(pwd):/repo" zricethezav/gitleaks:latest git /repo
#
# Para guardar el JSON localmente:
#
#   docker run --rm -v "$(pwd):/repo" zricethezav/gitleaks:latest git \
#     --report-path=/repo/gitleaks-report.json /repo

on:
  workflow_dispatch:

jobs:
  gitleaks-redacted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sLO https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run gitleaks (REDACTED — valores censurados)
        id: scan
        continue-on-error: true
        run: |
          gitleaks git --redact --report-path=gitleaks-report-redacted.json --report-format=json .
          exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code

      - name: Display redacted summary (solo metadatos, sin valores)
        if: always()
        run: |
          echo "## Gitleaks (redactado) — solo metadatos públicos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json, sys
          try:
              with open('gitleaks-report-redacted.json') as f:
                  data = json.load(f)
          except FileNotFoundError:
              print('No se generó reporte (no hay hallazgos).', file=sys.stderr)
              sys.exit(0)
          findings = data if isinstance(data, list) else data.get('findings', data.get('results', []))
          if not findings:
              print('✅ No se encontraron secretos en el historial.', file=sys.stderr)
              sys.exit(0)
          print(f'Total hallazgos: {len(findings)}', file=sys.stderr)
          print(file=sys.stderr)
          for f in findings:
              print(f'- Commit: {f.get(\"Commit\",\"?\")[:12]} | Archivo: {f.get(\"File\",\"?\")} | Regla: {f.get(\"RuleID\",\"?\")}', file=sys.stderr)
          " 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: Print local Docker command (reporte COMPLETO, en tu máquina)
        if: always()
        run: |
          echo "## Para correr el scan COMPLETO (local, con valores reales):" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'docker run --rm -v "$(pwd):/repo" zricethezav/gitleaks:latest git \' >> $GITHUB_STEP_SUMMARY
          echo '  --report-path=/repo/gitleaks-report.json /repo' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat <<'EOF'
        ╔══════════════════════════════════════════════════════════════╗
        ║  CORRÉ LOCALMENTE (no sube nada a GitHub):                  ║
        ║                                                              ║
        ║  docker run --rm -v "$(pwd):/repo" zricethezav/gitleaks:latest \
        ║    git --report-path=/repo/gitleaks-report.json /repo        ║
        ╚══════════════════════════════════════════════════════════════╝
EOF
