name: CI/CD

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bienenhaus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d bienenhaus_test >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bienenhaus_test
          SECRET_KEY: ci-secret-key-for-testing
          FLASK_DEBUG: 'false'
          ADMIN_PASSWORD: ci-admin-password-for-testing
          PYTHONDONTWRITEBYTECODE: '1'
          CSRF_BYPASS: '1'
          RATELIMIT_ENABLED: 'false'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: python -m pip install flake8

      - name: Lint Python (flake8)
        working-directory: backend
        run: flake8 . --max-line-length=160 --exclude=migrations

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JS build tooling
        working-directory: frontend
        run: npx terser --version

  # PRIMERA CORRIDA INFORMATIVA — continue-on-error: true
  # Una vez triageados los hallazgos, cambiar a false para que bloquee el merge.
  audit:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit tools
        run: |
          python -m pip install bandit pip-audit

      - name: bandit (SAST — high severity & confidence)
        working-directory: backend
        run: bandit -r . -ll -ii --exit-zero

      - name: pip-audit (dependency vulnerabilities)
        working-directory: backend
        run: pip-audit || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (frontend deps — high & critical only)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  # TODO (E2E — next sprint): Agregar job de E2E con Playwright:
  #   - test_pages.py (39 tests E2E dinámicos)
  #   - test_admin_audit.py (20 checks de auditoría de consola/API)
  # Ambos requieren Flask corriendo + browsers de Playwright instalados
  # en el runner. Pendiente de configurar service container para Flask
  # y paso de instalación de browsers (npx playwright install chromium).

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, lint, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set, skipping deploy"
            exit 0
          fi
          curl -X POST "$RENDER_HOOK" --fail
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
