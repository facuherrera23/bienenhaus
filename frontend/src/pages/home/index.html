<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="canonical" href="{{SITE_URL}}/"/>

  <meta name="description" content="Inmobiliaria de confianza en Córdoba. Casas, departamentos y fincas seleccionados por expertos."/>

    "@context": "https://schema.org",
    "@type": "RealEstateAgent",
    "name": "Bienenhaus Propiedades",
    "description": "Inmobiliaria en Córdoba. Casas, departamentos, fincas y terrenos seleccionados por expertos en el mercado inmobiliario de Córdoba.",

    "telephone": "+54 351 411-0000",
    "email": "info@bienenhaus.com.ar",
    "image": "{{SITE_URL}}/images/logo-bienenhaus.png",
    "logo": "{{SITE_URL}}/images/logo-bienenhaus.png",
    "priceRange": "$$",
    "currenciesAccepted": "USD",
    "areaServed": [
      { "@type": "City", "name": "Córdoba" },
      { "@type": "City", "name": "Córdoba Capital" }
    ],
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Córdoba",
      "addressRegion": "Córdoba",
      "addressCountry": "AR"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": -31.4201,
      "longitude": -64.1888
    },
    "openingHoursSpecification": [
      { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "09:00", "closes": "18:00" },
      { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "13:00" }
    ],
    "sameAs": [
      "https://www.instagram.com/bienenhaus.prop",
      "https://www.facebook.com/Bienenhaus.prop",
      "https://www.youtube.com/@BienenhausPropiedades",
      "https://www.tiktok.com/@bienenhaus.prop",
      "https://wa.me/5493514110000"
    ],
    "knowsAbout": [
      "Compra y venta de propiedades",
      "Alquiler de propiedades",
      "Tasaciones inmobiliarias",
      "Asesoría legal inmobiliaria"
    ],
    "foundingDate": "2022",
    "numberOfEmployees": { "@type": "QuantitativeValue", "minValue": 3, "maxValue": 10 },
    "hasCredential": { "@type": "EducationalOccupationalCredential", "credentialCategory": "Matrícula CPI", "name": "Matrícula CPI N° 1.834" }
  }
  </script>

  <!-- SEO + Open Graph -->
  <meta name="robots" content="index, follow"/>

  <link rel="manifest" href="/manifest.json"/>

<body>
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
