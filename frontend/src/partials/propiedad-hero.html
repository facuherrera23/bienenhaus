<section id="propiedad-hero" class="propiedad-hero">
  <div class="propiedad-hero-bg" id="propiedadHeroBg">
    <div class="propiedad-hero-overlay"></div>
  </div>
  <div class="container">
    <nav class="breadcrumb" aria-label="Navegación">
      <a href="/">Inicio</a>
      <span>/</span>
      <a href="/venta">Comprar</a>
      <span>/</span>
      <span id="breadcrumbTitle">{{PROP_TITLE}}</span>
    </nav>
    <div class="propiedad-hero-content">
      <div class="propiedad-hero-meta">
        <span class="badge badge-tipo" id="propTipoBadge">{{PROP_TYPE}}</span>
        <span class="badge badge-status" id="propStatusBadge">{{PROP_STATUS}}</span>
      </div>
      <h1 id="propiedadTitle">{{PROP_TITLE}}</h1>
      <p class="propiedad-hero-location" id="propiedadLocation">{{PROP_LOCATION}}</p>
      <div class="propiedad-hero-price" id="propiedadPrice">USD {{PROP_PRICE}}</div>
    </div>
  </div>
</section>
