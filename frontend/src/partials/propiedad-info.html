<section id="propiedad-info" class="section propiedad-info">
  <div class="container">
    <div class="propiedad-info-grid">
      <div class="propiedad-gallery">
        <div class="propiedad-main-image" id="mainImage">
          <img id="mainImageEl" src="" alt="" fetchpriority="high" loading="eager">
        </div>
        <div class="propiedad-thumbnails" id="thumbnails">
          <!-- thumbs injected by JS -->
        </div>
      </div>

      <div class="propiedad-details">
        <div class="propiedad-header">
          <div class="propiedad-meta">
            <span class="badge badge-tipo" id="detalleTipoBadge"></span>
            <span class="badge badge-status" id="detalleStatusBadge"></span>
          </div>
          <h1 id="detalleTitle"></h1>
          <p class="propiedad-location" id="detalleLocation"></p>
          <div class="propiedad-price" id="detallePrice"></div>
          <div class="propiedad-status-row" id="detalleStatusRow"></div>
        </div>

        <div class="propiedad-description" id="detalleDescription"></div>

        <div class="propiedad-specs" id="detalleSpecs"></div>

        <div class="propiedad-actions" id="detalleActions"></div>

        <div class="propiedad-agent" id="detalleAgent"></div>

        <div class="propiedad-similares" id="similaresSection" style="display:none">
          <h3>Propiedades similares</h3>
          <div id="similaresGrid" class="props-grid"></div>
        </div>
      </div>
    </div>
  </div>
</section>
